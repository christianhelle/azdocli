name: Build

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "Cargo.toml"
      - "src/**/*.rs"
      - "build.rs"
      - "images/icon.ico"
  workflow_dispatch:

env:
  VERSION: 0.6.5

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
      - name: Update Version
        shell: pwsh
        run: |
          $version = (Get-Content -Path Cargo.toml -Raw) -replace 'version = "0.1.0"', 'version = "${{ env.VERSION }}"'
          $version | Set-Content -Path Cargo.toml
      - name: Install Rust
        uses: christianhelle/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Rust cache
        uses: christianhelle/rust-cache@v2
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Verify publish (dry-run)
        run: cargo publish --dry-run --allow-dirty
      - name: Build
        run: cargo build --release
      - name: Zip artifacts
        shell: pwsh
        run: |
          mv target/release/azdocli* ./
          Compress-Archive azdocli*, README.md, LICENSE ${{ env.TARGET }}.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET }}
          path: ${{ env.TARGET }}.zip
