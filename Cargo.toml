[package]
name = "azdocli"
version = "0.1.0"
edition = "2021"
authors = ["Christian Helle"]
description = "CLI tool for interacting with Azure DevOps"
license = "MIT"
homepage = "https://christianhelle.com/azdocli"
repository = "https://github.com/christianhelle/azdocli"
readme = "README.md"

[package.metadata.bundle]
name = "Azure DevOps CLI"
identifier = "com.christianhelle.azdocli"
icon = ["images/icon.png"]
category = "Developer Tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
dirs = "6.0"
dialoguer = "0.12"
colored = "3.0"
azure_core = "0.34"
azure_devops_rust_api = { version = "0.36.0", features = [
  "artifacts",
  "artifacts_download",
  "git",
  "pipelines",
  "wit",
  "core",
  "wiki",
  "search",
  "build",
  "release",
  "dashboard",
  "distributed_task",
  "processes",
  "processadmin",
  "service_endpoint",
  "test",
  "test_plan",
  "work",
  "graph",
  "operations",
  "member_entitlement_management",
], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
url = "2.5"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
futures = "0.3"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
machine-uid = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
